name: CI-CD-AKS

on:
  push:
    branches:
      - main

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker login to ACR
        run: |
          test -n "$ACR_NAME" || (echo "Missing secret: ACR_NAME" && exit 1)
          test -n "$ACR_USERNAME" || (echo "Missing secret: ACR_USERNAME" && exit 1)
          test -n "$ACR_PASSWORD" || (echo "Missing secret: ACR_PASSWORD" && exit 1)
          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin

      - name: Build and push backend
        run: |
          docker build -t "$ACR_LOGIN_SERVER/backend:latest" ./backend
          docker push "$ACR_LOGIN_SERVER/backend:latest"

      - name: Build and push frontend
        run: |
          docker build -t "$ACR_LOGIN_SERVER/frontend:latest" --build-arg REACT_APP_API_URL=http://backend-service:5000/todos ./frontend
          docker push "$ACR_LOGIN_SERVER/frontend:latest"

